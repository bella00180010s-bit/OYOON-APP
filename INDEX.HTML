<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OYOON - عيون الأشياء</title>

<link rel="stylesheet" href="STYLE,.css">
</head>

<body>

<main class="container">

<header>
<h1>عيون 👁</h1>
<p>مساعدك الصوتي للتعرف على الأشياء</p>
</header>

<section class="welcome">
<h2>مرحباً بك في تطبيق عيون</h2>
<p>
أنا هنا لمساعدتك على معرفة الأشياء
من حولك عن طريق الصوت.
</p>
</section>

<section class="controls">
<section id="reader"></section>
<button id="scanButton">
مسح رمز QR
</button>

<button id="speakButton">
الاستماع إلى وصف الغرض
</button>

<button id="addButton">
إضافة غرض جديد
</button>

</section>

<section class="result" aria-live="polite">
<h2>نتيجة التعرف</h2>
<p id="resultText">
لم يتم التعرف على أي غرض بعد.
</p>
</section>

<footer>
<p>OYOON © 2026</p>
<p>التكنولوجيا لخدمة الجميع</p>
</footer>

</main>

<!-- <script src="APP.js"></script> -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script src="APP.js"></script>
</body>
</html>
